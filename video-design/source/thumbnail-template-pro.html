<!doctype html>
<html lang="ar"><head><meta charset="utf-8">
<style>
@font-face{font-family:Cairo;font-weight:900;src:url(node_modules/@fontsource/cairo/files/cairo-arabic-900-normal.woff2)}
@font-face{font-family:Cairo;font-weight:700;src:url(node_modules/@fontsource/cairo/files/cairo-arabic-700-normal.woff2)}
@font-face{font-family:CairoL;font-weight:900;src:url(node_modules/@fontsource/cairo/files/cairo-latin-900-normal.woff2)}
@font-face{font-family:CairoL;font-weight:700;src:url(node_modules/@fontsource/cairo/files/cairo-latin-700-normal.woff2)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#efefed;font-family:Cairo,CairoL,sans-serif;color:#151515}
#bg{position:absolute;inset:0;background:#f2f2f0;background-image:linear-gradient(rgba(0,0,0,.07) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(0,0,0,.07) 1.5px,transparent 1.5px);background-size:36px 36px}
#cr{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.55}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 58%,rgba(0,0,0,.16));z-index:90}
.o{position:absolute}
.sk{fill:none;stroke:#3a3a3a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.skl{fill:none;stroke:#9a9a9a;stroke-width:3;stroke-linecap:round}
.pk{stroke:#FF66B2}
.strip{background:#fff;padding:26px 44px 38px;direction:rtl;filter:drop-shadow(0 10px 14px rgba(0,0,0,.14)) drop-shadow(0 2px 3px rgba(0,0,0,.1))}
.strip>div{background:#fff}
.t1{font-weight:900;line-height:1.08;white-space:nowrap}
.t1 em{font-style:normal;color:#FF66B2}
.hl{background:#FF66B2;color:#151515;padding:0 14px 4px;display:inline-block;transform:rotate(-1.5deg)}
.t2{font-weight:700;font-size:44px;color:#444;margin-top:12px;white-space:nowrap}
.stk{filter:drop-shadow(0 14px 16px rgba(0,0,0,.22)) drop-shadow(0 2px 4px rgba(0,0,0,.15))}
.lbl{background:#fff;padding:4px 16px 8px;font-weight:700;font-size:32px;direction:rtl;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:CairoL,Cairo}
.chain{direction:rtl;display:flex;gap:14px;align-items:center;font-weight:700;font-size:34px;background:#fff;padding:10px 26px 14px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.14))}
.chain .a{color:#FF66B2;font-weight:900}
.chain b{background:#FF66B2;padding:0 10px}
#logo{right:44px;top:44px;font-family:CairoL;font-weight:900;font-size:58px;line-height:.85;text-align:center;background:#fff;padding:12px 16px;transform:rotate(3deg);filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
#logo span{display:block;color:#FF66B2}
