function rnd(s){let x=Math.sin(s*999.7)*43758.5453;return x-Math.floor(x);}
function tear(el,seed,a){const w=el.offsetWidth,h=el.offsetHeight,st=a>10?26:16,p=[];let k=seed;
 for(let x=0;x<=w;x+=st)p.push(`${Math.min(x,w)}px ${rnd(k++)*a}px`);for(let y=st;y<=h;y+=st)p.push(`${w-rnd(k++)*a}px ${Math.min(y,h)}px`);
 for(let x=w-st;x>=0;x-=st)p.push(`${Math.max(x,0)}px ${h-rnd(k++)*a}px`);for(let y=h-st;y>0;y-=st)p.push(`${rnd(k++)*a}px ${y}px`);
 el.style.clipPath=`polygon(${p.join(',')})`;}
document.fonts.ready.then(()=>{let s=3;document.querySelectorAll('[data-tear]').forEach(el=>tear(el,s+=53,+el.dataset.tear));document.body.dataset.ready=1;});
