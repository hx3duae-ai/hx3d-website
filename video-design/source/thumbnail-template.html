<!doctype html>
<html lang="ar"><head><meta charset="utf-8">
<style>
@font-face{font-family:Cairo;font-weight:900;src:url(node_modules/@fontsource/cairo/files/cairo-arabic-900-normal.woff2)}
@font-face{font-family:Cairo;font-weight:700;src:url(node_modules/@fontsource/cairo/files/cairo-arabic-700-normal.woff2)}
@font-face{font-family:CairoL;font-weight:900;src:url(node_modules/@fontsource/cairo/files/cairo-latin-900-normal.woff2)}
@font-face{font-family:Ruqaa;font-weight:700;src:url(node_modules/@fontsource/aref-ruqaa/files/aref-ruqaa-arabic-700-normal.woff2)}
:root{--pink:#FF66B2;--ink:#111}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#ececec;font-family:Cairo,CairoL,sans-serif;color:var(--ink)}
#bg{position:absolute;inset:0;background:#f1f1ef;
 background-image:linear-gradient(#cfcfcf 2px,transparent 2px),linear-gradient(90deg,#cfcfcf 2px,transparent 2px),linear-gradient(#e2e2e2 1px,transparent 1px),linear-gradient(90deg,#e2e2e2 1px,transparent 1px);
 background-size:96px 96px,96px 96px,24px 24px,24px 24px}
#crumple,#grain{position:absolute;inset:0;pointer-events:none}
#crumple{mix-blend-mode:multiply;opacity:.55}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 50%,rgba(0,0,0,.28));z-index:60;pointer-events:none}
.o{position:absolute}
.shadow{box-shadow:0 22px 40px rgba(0,0,0,.28),0 4px 10px rgba(0,0,0,.18)}
.print{background:#f7f5ef;padding:34px 34px 34px;border-radius:4px}
.print .ph{width:100%;height:100%;background:#151515;position:relative;overflow:hidden;border-radius:2px}
.print .ph::after{content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.35'/></svg>")}
.halftone{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.4px);background-size:9px 9px}
.label{font-weight:900;line-height:1;padding:16px 34px 34px;white-space:nowrap;direction:rtl}
.pk{background:var(--pink)}
.wh{background:#fff}
.bk{background:var(--ink);color:#fff}
.tape{position:absolute;width:170px;height:58px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 4px rgba(0,0,0,.1)}
.hand{font-family:Ruqaa;font-weight:700}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:CairoL,Cairo}
.strip{background:#fbfbf8;padding:26px 30px;direction:rtl}
</style></head><body>
<div id="bg"></div>
<svg id="crumple" width="1920" height="1080"><filter id="cr" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".0045" numOctaves="4" seed="7"/><feDiffuseLighting lighting-color="#fff" surfaceScale="9"><feDistantLight azimuth="225" elevation="55"/></feDiffuseLighting></filter><rect width="1920" height="1080" filter="url(#cr)"/></svg>
<div id="stage"></div>
<div id="vig"></div>
<svg width="0" height="0" style="position:absolute"><defs>

 <g id="spool"><circle cx="100" cy="100" r="92" fill="#fff" stroke="#111" stroke-width="7"/><circle cx="100" cy="100" r="60" fill="none" stroke="currentColor" stroke-width="44"/><circle cx="100" cy="100" r="26" fill="#fff" stroke="#111" stroke-width="7"/><circle cx="100" cy="100" r="8" fill="#111"/><path d="M160 140 q40 12 34 60" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/></g>

<script>

};
const c=V[+(new URLSearchParams(location.search).get('v')||1)];
const art={
problems:`<svg viewBox="0 0 640 400" width="100%" height="100%"><g transform="translate(150 40) scale(1.05)"><use href="#printer"/>

 <g fill="#FF66B2"><circle cx="80" cy="330" r="8"/><circle cx="590" cy="320" r="6"/></g></svg>`

document.getElementById('stage').innerHTML=`

 <!-- pencil top-right -->
 <svg class="o" style="right:-60px;top:-10px" width="520" height="120" viewBox="0 0 520 120"><g transform="rotate(8 260 60)"><rect x="60" y="40" width="420" height="40" fill="#fff" stroke="#111" stroke-width="4"/><rect x="430" y="40" width="50" height="40" fill="#FF66B2" stroke="#111" stroke-width="4"/><polygon points="60,40 10,60 60,80" fill="#f0d9b5" stroke="#111" stroke-width="4"/><polygon points="26,54 10,60 26,66" fill="#111"/></g></svg>

 <svg class="o shadowsvg" style="left:-70px;bottom:-60px" width="300" height="300" viewBox="0 0 300 300"><circle cx="150" cy="150" r="130" fill="rgba(240,240,240,.85)" stroke="#bdbdbd" stroke-width="4"/><circle cx="150" cy="150" r="80" fill="#e6e6e6" stroke="#9a9a9a" stroke-width="10"/><circle cx="150" cy="150" r="60" fill="#f1f1ef"/></svg>
 <!-- spool bottom-right -->
 <svg class="o" style="right:40px;bottom:-70px;color:#FF66B2;filter:drop-shadow(0 14px 18px rgba(0,0,0,.25))" width="260" height="260" viewBox="0 0 200 200"><use href="#spool"/></svg>

 <div class="o print shadow" style="right:-90px;top:250px;width:330px;height:380px;transform:rotate(7deg);padding:22px 22px 70px"><div class="ph" style="background:#2a2a2a"><div class="halftone"></div>
  <svg viewBox="0 0 200 200" width="100%" height="100%"><path d="M70 40 h60 l-10 30 q40 40 20 100 h-80 q-20 -60 20 -100z" fill="#cfcfcf" stroke="#fff" stroke-width="5"/><g stroke="#888" stroke-width="3"><line x1="52" y1="100" x2="148" y2="100"/><line x1="48" y1="130" x2="152" y2="130"/></g></svg></div></div>

 <div class="o print shadow" style="left:560px;top:230px;width:820px;height:560px;transform:rotate(-6deg)"><div class="ph" style="background:#1d1d1d"><div class="halftone"></div></div></div>
 <!-- main print -->
 <div class="o print shadow" style="left:560px;top:235px;width:820px;height:560px;transform:rotate(-1.5deg)"><div class="ph"><div class="halftone"></div>${art[c.art]}</div></div>
 <!-- left note strip with clip -->
 <div class="o strip shadow" style="left:300px;top:330px;width:300px;height:520px;transform:rotate(-5deg);font-size:54px;font-weight:700;line-height:1.6;text-align:center;padding-top:60px">${c.note.map(x=>'<div>'+x+'</div>').join('')}
  <svg width="300" height="40" viewBox="0 0 300 40" style="margin-top:16px"><path d="M30 20 q60 -24 120 0 t120 0" fill="none" stroke="#FF66B2" stroke-width="7" stroke-linecap="round"/></svg></div>
 <svg class="o" style="left:520px;top:300px;transform:rotate(-5deg)" width="60" height="170" viewBox="0 0 60 170"><use href="#clip"/></svg>
 <!-- tape on main -->
 <div class="tape" style="left:1290px;top:215px;transform:rotate(38deg)"></div>
 <!-- title label top -->
 <div class="o label pk shadow" style="left:50%;top:70px;transform:translateX(-50%) rotate(-1.5deg);font-size:${c.fs}px">${c.t1}</div>
 <!-- second label bottom with clip -->
 <div class="o label wh shadow" style="left:690px;top:800px;transform:rotate(1.5deg);font-size:${c.fs2}px;border-right:14px solid #FF66B2">${c.t2}<svg style="position:absolute;right:-34px;top:-62px;transform:rotate(6deg)" width="60" height="170" viewBox="0 0 60 170"><use href="#clip"/></svg></div>

 <div class="o" style="right:120px;top:640px;transform:rotate(-14deg)">
  <svg width="330" height="210" viewBox="0 0 330 210" style="filter:drop-shadow(0 12px 14px rgba(0,0,0,.25))"><path d="M70 10 H320 V200 H70 L10 140 V70 z" fill="#111"/><circle cx="58" cy="105" r="14" fill="#f1f1ef" stroke="#FF66B2" stroke-width="5"/>
  <text x="200" y="125" text-anchor="middle" font-family="Ruqaa" font-weight="700" font-size="56" fill="#FF66B2" direction="rtl">${c.tag}</text></svg>
  <svg class="o" style="left:-60px;top:50px" width="120" height="80" viewBox="0 0 210 120"><path d="M200 45 C140 10 80 110 0 60" fill="none" stroke="#777" stroke-width="3"/></svg>
 </div>
 <!-- brand -->
 <div class="o" style="left:46px;bottom:40px;display:flex;align-items:center;gap:12px;background:#111;color:#fff;border-radius:40px;padding:10px 26px 10px 20px;font-family:CairoL;font-weight:900;font-size:40px;z-index:70"><span style="width:18px;height:18px;border-radius:50%;background:#FF66B2;display:inline-block"></span>HX 3D</div>
`;
</script></body></html>
